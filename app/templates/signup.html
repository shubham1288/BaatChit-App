<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — BaatChit</title>
  <meta name="description" content="Create your BaatChit account for secure real-time messaging." />
  <link rel="stylesheet" href="/static/css/auth.css" />
</head>
<body>
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 2H4C2.9 2 2 2.9 2 4v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
        </svg>
      </div>
      <div class="auth-logo-text">Baat<span>Chit</span></div>
    </div>

    <h1 class="auth-heading">Create account</h1>
    <p class="auth-sub">Join BaatChit and start messaging securely</p>

    <div id="alertBox" class="alert"></div>

    <form id="signupForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input id="username" name="username" type="text" class="form-input"
               placeholder="choose_username" autocomplete="username" required />
        <p class="field-error" id="usernameError"></p>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password <span style="color:#484f58;font-weight:400">(min 6 chars)</span></label>
        <input id="password" name="password" type="password" class="form-input"
               placeholder="••••••••" autocomplete="new-password" required />
        <div class="pw-strength">
          <div class="pw-strength-bar" id="pwBar"></div>
        </div>
        <p class="field-error" id="passwordError"></p>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        <span class="btn-text">Create Account</span>
        <span class="btn-loader"></span>
      </button>
    </form>

    <p class="auth-footer">
      Already have an account? <a href="/login-page">Sign in</a>
    </p>
  </div>

  <script src="/static/js/signup.js"></script>
</body>
</html>
